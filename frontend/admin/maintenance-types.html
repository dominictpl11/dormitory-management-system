<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Types - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fas fa-home"></i> Dormitory Management</a>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>
    
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <nav class="nav flex-column mt-3">
                    <a class="nav-link" href="dashboard.html">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </a>
                    <a class="nav-link" href="profile.html">
                        <i class="fas fa-user"></i> Profile
                    </a>
                    <a class="nav-link" href="dormitories.html">
                        <i class="fas fa-building"></i> Dormitories
                    </a>
                    <a class="nav-link" href="adjustments.html">
                        <i class="fas fa-exchange-alt"></i> Adjustments
                    </a>
                    <a class="nav-link" href="maintenances.html">
                        <i class="fas fa-tools"></i> Maintenances
                    </a>
                    <a class="nav-link active" href="maintenance-types.html">
                        <i class="fas fa-cog"></i> Maintenance Types
                    </a>
                </nav>
            </div>
            
            <div class="col-md-10 content-area">
                <h2 class="mb-4">Maintenance Types</h2>
                
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title mb-4">Add New Type</h5>
                        <form id="type-form">
                            <div class="row">
                                <div class="col-md-6">
                                    <label class="form-label">Type Name</label>
                                    <input type="text" class="form-control" id="type-name" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Cost (¥)</label>
                                    <input type="number" step="0.01" class="form-control" id="type-cost" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">&nbsp;</label>
                                    <button type="submit" class="btn btn-primary w-100">
                                        <i class="fas fa-plus"></i> Add
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title mb-4">Existing Types</h5>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Type Name</th>
                                        <th>Cost</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="type-table">
                                    <tr>
                                        <td colspan="4" class="text-center">Loading...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin/maintenance-types.js"></script>
</body>
</html>
