<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Dormitory Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fas fa-home"></i> Dormitory Management</a>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>
    
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <nav class="nav flex-column mt-3">
                    <a class="nav-link active" href="dashboard.html">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </a>
                    <a class="nav-link" href="profile.html">
                        <i class="fas fa-user"></i> Profile
                    </a>
                    <a class="nav-link" href="dormitories.html">
                        <i class="fas fa-building"></i> Dormitories
                    </a>
                    <a class="nav-link" href="adjustments.html">
                        <i class="fas fa-exchange-alt"></i> Adjustments
                    </a>
                    <a class="nav-link" href="maintenances.html">
                        <i class="fas fa-tools"></i> Maintenances
                    </a>
                    <a class="nav-link" href="maintenance-types.html">
                        <i class="fas fa-cog"></i> Maintenance Types
                    </a>
                </nav>
            </div>
            
            <div class="col-md-10 content-area">
                <h2 class="mb-4">Admin Dashboard</h2>
                <div class="row">
                    <div class="col-md-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <i class="fas fa-building fa-3x text-primary mb-3"></i>
                                <h5>Dormitory Management</h5>
                                <p class="text-muted">View all dormitories</p>
                                <a href="dormitories.html" class="btn btn-primary">Manage</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <i class="fas fa-exchange-alt fa-3x text-warning mb-3"></i>
                                <h5>Adjustment Requests</h5>
                                <p class="text-muted">Process adjustments</p>
                                <a href="adjustments.html" class="btn btn-warning">Process</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <i class="fas fa-tools fa-3x text-success mb-3"></i>
                                <h5>Maintenance</h5>
                                <p class="text-muted">Manage maintenance requests</p>
                                <a href="maintenances.html" class="btn btn-success">Manage</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        if (!sessionStorage.getItem('token') || sessionStorage.getItem('role') !== 'admin') {
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
