<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dormitories - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fas fa-home"></i> Dormitory Management</a>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>
    
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <nav class="nav flex-column mt-3">
                    <a class="nav-link" href="dashboard.html">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </a>
                    <a class="nav-link" href="profile.html">
                        <i class="fas fa-user"></i> Profile
                    </a>
                    <a class="nav-link active" href="dormitories.html">
                        <i class="fas fa-building"></i> Dormitories
                    </a>
                    <a class="nav-link" href="adjustments.html">
                        <i class="fas fa-exchange-alt"></i> Adjustments
                    </a>
                    <a class="nav-link" href="maintenances.html">
                        <i class="fas fa-tools"></i> Maintenances
                    </a>
                    <a class="nav-link" href="maintenance-types.html">
                        <i class="fas fa-cog"></i> Maintenance Types
                    </a>
                </nav>
            </div>
            
            <div class="col-md-10 content-area">
                <h2 class="mb-4">Dormitory Management</h2>
                
                <ul class="nav nav-tabs mb-3" id="dormTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="dormitories-tab" data-bs-toggle="tab" data-bs-target="#dormitories" type="button" role="tab">
                            <i class="fas fa-building"></i> All Dormitories
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="unassigned-tab" data-bs-toggle="tab" data-bs-target="#unassigned" type="button" role="tab">
                            <i class="fas fa-user-plus"></i> Unassigned Students
                        </button>
                    </li>
                </ul>
                
                <div class="tab-content" id="dormTabsContent">
                    <div class="tab-pane fade show active" id="dormitories" role="tabpanel">
                        <div class="card">
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-hover">
                                        <thead>
                                    <tr>
                                        <th>Dorm ID</th>
                                        <th>Building</th>
                                        <th>Floor</th>
                                        <th>Room No</th>
                                        <th>Gender</th>
                                        <th>Occupancy</th>
                                        <th>Capacity</th>
                                        <th>Vacant Beds</th>
                                        <th>Payment Status</th>
                                        <th>Status</th>
                                    </tr>
                                        </thead>
                                        <tbody id="dormitory-table">
                                            <tr>
                                                <td colspan="10" class="text-center">Loading...</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="tab-pane fade" id="unassigned" role="tabpanel">
                        <div class="card">
                            <div class="card-body">
                                <div id="unassigned-students">
                                    <p class="text-muted">Loading...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Assign Dormitory Modal -->
    <div class="modal fade" id="assignModal" tabindex="-1" aria-labelledby="assignModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="assignModalLabel">Assign Dormitory</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p><strong>Student:</strong> <span id="assign-student-name"></span> (<span id="assign-student-id"></span>)</p>
                    <div class="mb-3">
                        <label for="assign-dorm-select" class="form-label">Select Dormitory <span class="text-danger">*</span></label>
                        <select class="form-select" id="assign-dorm-select" required>
                            <option value="">Loading...</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="assignDormitory()">
                        <i class="fas fa-bed"></i> Assign
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin/dormitories.js"></script>
</body>
</html>
