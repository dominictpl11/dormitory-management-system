<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Dormitory Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fas fa-home"></i> Dormitory Management</a>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>
    
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <nav class="nav flex-column mt-3">
                    <a class="nav-link active" href="dashboard.html">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </a>
                    <a class="nav-link" href="profile.html">
                        <i class="fas fa-user"></i> Profile
                    </a>
                    <a class="nav-link" href="dormitory.html">
                        <i class="fas fa-bed"></i> Dormitory
                    </a>
                    <a class="nav-link" href="adjustment.html">
                        <i class="fas fa-exchange-alt"></i> Adjustment
                    </a>
                    <a class="nav-link" href="maintenance.html">
                        <i class="fas fa-tools"></i> Maintenance
                    </a>
                    <a class="nav-link" href="fees.html">
                        <i class="fas fa-dollar-sign"></i> Fees
                    </a>
                </nav>
            </div>
            
            <div class="col-md-10 content-area">
                <h2 class="mb-4">Student Dashboard</h2>
                <div class="row">
                    <div class="col-md-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <i class="fas fa-bed fa-3x text-primary mb-3"></i>
                                <h5>My Dormitory</h5>
                                <p class="text-muted">View dormitory information</p>
                                <a href="dormitory.html" class="btn btn-primary">View</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <i class="fas fa-exchange-alt fa-3x text-warning mb-3"></i>
                                <h5>Adjustment Requests</h5>
                                <p class="text-muted">Manage dormitory adjustments</p>
                                <a href="adjustment.html" class="btn btn-warning">View</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <i class="fas fa-tools fa-3x text-success mb-3"></i>
                                <h5>Maintenance</h5>
                                <p class="text-muted">Submit maintenance requests</p>
                                <a href="maintenance.html" class="btn btn-success">View</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // Check authentication
        if (!sessionStorage.getItem('token') || sessionStorage.getItem('role') !== 'student') {
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
