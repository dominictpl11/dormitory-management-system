<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fees - Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fas fa-home"></i> Dormitory Management</a>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>
    
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <nav class="nav flex-column mt-3">
                    <a class="nav-link" href="dashboard.html">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </a>
                    <a class="nav-link" href="profile.html">
                        <i class="fas fa-user"></i> Profile
                    </a>
                    <a class="nav-link" href="dormitory.html">
                        <i class="fas fa-bed"></i> Dormitory
                    </a>
                    <a class="nav-link" href="adjustment.html">
                        <i class="fas fa-exchange-alt"></i> Adjustment
                    </a>
                    <a class="nav-link" href="maintenance.html">
                        <i class="fas fa-tools"></i> Maintenance
                    </a>
                    <a class="nav-link active" href="fees.html">
                        <i class="fas fa-dollar-sign"></i> Fees
                    </a>
                </nav>
            </div>
            
            <div class="col-md-10 content-area">
                <h2 class="mb-4">Dormitory Fee Overview</h2>
                
                <!-- Statistics Cards -->
                <div class="row mb-4" id="fee-statistics">
                    <div class="col-md-3">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title text-primary">Total Fees</h5>
                                <h3 id="total-fees">-</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title text-success">Paid</h5>
                                <h3 id="paid-fees">-</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title text-warning">Unpaid</h5>
                                <h3 id="unpaid-fees">-</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title text-info">Unpaid Amount</h5>
                                <h3 id="unpaid-amount">¥0.00</h3>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Fee List by Type -->
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title mb-4">Fee Details</h5>
                        <div id="fee-list">
                            <p class="text-muted">Loading...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/student/fees.js"></script>
</body>
</html>
